name: Release ICC Lens

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          version: 11.7.0
          cache: true
          runtime: node@24
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify tag matches extension version
        run: test "$GITHUB_REF_NAME" = "v$(node -p \"JSON.parse(require('fs').readFileSync('apps/extension/package.json', 'utf8')).version\")"
      - run: pnpm check:release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*.zip
          .output/*.sha256
          --verify-tag
          --title "ICC Lens $GITHUB_REF_NAME"
          --generate-notes
