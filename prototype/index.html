      function getState() {
        const params = new URLSearchParams(location.search)
        return {
          page: pages.some(function (entry) {
            return entry[0] === params.get('page')
          })
            ? params.get('page')
            : 'home',
          category: params.get('category') || 'Latest additions',
          query: params.get('q') || 'GraphQL',
          theme: params.get('theme') === 'dark' ? 'dark' : 'light',
          season: params.get('season') === '2' ? 2 : 1,
          fileState: params.get('fileState') === 'info' ? 'info' : 'collection',
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;',
          }[character]
        })
      }

      function formatTime(seconds) {
        const safeSeconds = Math.max(0, Math.round(seconds))
        const hours = Math.floor(safeSeconds / 3600)
        const minutes = Math.floor((safeSeconds % 3600) / 60)
        const remainder = safeSeconds % 60
        return [hours, minutes, remainder]
          .map(function (part) {
            return String(part).padStart(2, '0')
          })
          .join(':')
      }

      function categoryScopeForGroup(groupName) {
        if (/^movies?$/i.test(groupName)) return 'movie'
        if (/(tv|series|show)/i.test(groupName)) return 'series'
        return 'file'
      }

      function categoryScopeForCategory(categoryName) {
        const group = groups.find(function (candidate) {
          return candidate.categories.some(function (category) {
            return category[0] === categoryName
          })
        })
        return group ? categoryScopeForGroup(group.name) : 'global'
      }

      function setParams(changes, replace) {
        const params = new URLSearchParams(location.search)
        params.delete('variant')
        Object.keys(changes).forEach(function (key) {
          const value = changes[key]
          if (value === null || value === undefined || value === '')
            params.delete(key)
          else params.set(key, value)
        })
        const next = location.pathname + '?' + params.toString()
        history[replace ? 'replaceState' : 'pushState']({}, '', next)
        render()
      }

        const active = state.page === page
        const dark = state.theme === 'dark'

        return (

          '" class="' +
          base +
          tone +
          '" aria-current="' +
          (active ? 'page' : 'false') +
          '">' +
          label +
          '</button>'
        )
      }

      function renderVariantA(state) {
        const dark = state.theme === 'dark'
        let content = homeA(state, dark)
        if (state.page === 'library') content = libraryA(state, dark)
        if (state.page === 'search') content = searchA(state, dark)
        if (state.page === 'detail') content = detailA(dark)
        if (state.page === 'series') content = seriesA(state, dark)
        if (state.page === 'download') content = downloadA(state, dark)
        if (state.page === 'states') content = statesA(dark)
        return applyISPCineTheme(shellA(state, content), dark)
      }

      function render() {
        const state = getState()
        const dark = state.theme === 'dark'
        const app = document.getElementById('app')
        const content = renderVariantA(state)
        app.innerHTML =
          '<div data-page-content ' +
          (playerState.open ? 'inert aria-hidden="true" ' : '') +
          '>' +
          content +
          applyISPCineTheme(browsePanel(state), dark) +
          '</div>' +
          playerOverlay()
        bindInteractions()
        scheduleFeatureAdvance()
        document.body.classList.toggle('bg-[#f7f2e8]', !dark)
        document.body.classList.toggle('text-[#17130e]', !dark)
        document.body.classList.toggle('bg-[#05080d]', dark)
        document.body.classList.toggle('text-[#f6f0e7]', dark)
        if (!playerState.open) window.scrollTo({ top: 0, behavior: 'instant' })
        if (playerState.open) {
          document.body.classList.add('overflow-hidden')
          startPlayerClock()
        } else {
          document.body.classList.remove('overflow-hidden')
          stopPlayerClock()
        }
      }

      function openPlayer(button) {
        playerState.open = true
        playerState.playing = true
        playerState.title = button.getAttribute('data-player-title') || 'Media'
        playerState.context =
          button.getAttribute('data-player-context') || 'Ready to play'
        playerState.seasonNumber = Number(
          button.getAttribute('data-player-season') || 1,
        )
        playerState.episodeNumber = Number(
          button.getAttribute('data-player-episode') || 1,
        )
        playerState.image =
          button.getAttribute('data-player-image') || items[0].image
        playerState.currentTime = Number(
          button.getAttribute('data-player-current-time') || 0,
        )
        playerState.duration = Number(
          button.getAttribute('data-player-duration') || 6600,
        )
        playerState.controlsVisible = true
        playerState.shortcutsOpen = false
        playerState.episodeListOpen = false
        playerState.reviewState = 'normal'
        render()
        document.querySelector('[data-player-overlay]')?.focus()
        showPlayerToast('Playing')
        schedulePlayerControls()
      }

      function closePlayer() {
        recordWatchProgress()
        playerState.open = false
        playerState.playing = false
        playerState.shortcutsOpen = false
        playerState.episodeListOpen = false
        playerState.reviewState = 'normal'
        if (document.fullscreenElement) void document.exitFullscreen()
        render()
        document.querySelector('[data-open-player]')?.focus()
      }

      function startPlayerClock() {
        if (playerClock) return
        playerClock = window.setInterval(function () {
          if (!playerState.open || !playerState.playing) return
          playerState.currentTime = Math.min(
            playerState.duration,
            playerState.currentTime + 1,
          )
          if (playerState.currentTime >= playerState.duration)
            playerState.playing = false
          recordWatchProgress()
          updatePlayerUi()
        }, 1000)
      }

      function stopPlayerClock() {
        if (playerClock) window.clearInterval(playerClock)
        playerClock = null
        if (playerControlsTimer) window.clearTimeout(playerControlsTimer)
        playerControlsTimer = null
      }

      function updatePlayerUi() {
        if (!playerState.open) return
        const progress = Math.round(
          (playerState.currentTime / playerState.duration) * 1000,
        )
        const remaining = Math.max(
          0,
          playerState.duration - playerState.currentTime,
        )
        const progressInput = document.querySelector('[data-player-progress]')
        const volumeInput = document.querySelector('[data-player-volume]')
        const time = document.querySelector('[data-player-time]')
        if (progressInput) {
          progressInput.value = progress
          progressInput.setAttribute(
            'aria-valuetext',
            formatTime(playerState.currentTime) +
              ' of ' +
              formatTime(playerState.duration),
          )
        }
        if (volumeInput)
          volumeInput.value = Math.round(playerState.volume * 100)
        if (time)
          time.textContent =
            formatTime(playerState.currentTime) + ' · −' + formatTime(remaining)
      }

      function recordWatchProgress() {
        if (!playerState.title || playerState.currentTime < 1) return
        const existingIndex = continueWatching.findIndex(function (entry) {
          return (
            entry.title === playerState.title &&
            entry.context === playerState.context
          )
        })
        const progress = {
          title: playerState.title,
          context: playerState.context,
          image: playerState.image,
          currentTime: Math.round(playerState.currentTime),
          duration: playerState.duration,
          seasonNumber: playerState.seasonNumber,
          episodeNumber: playerState.episodeNumber,
        }
        if (existingIndex >= 0) continueWatching.splice(existingIndex, 1)
        continueWatching.unshift(progress)
        continueWatching.splice(6)
      }

      function announcePlayer(message) {
        const live = document.querySelector('[data-player-live]')
        if (live) live.textContent = message
      }

      function showPlayerToast(message) {
        const toast = document.querySelector('[data-player-toast]')
        if (toast) {
          toast.textContent = message
          toast.classList.remove('hidden')
          if (playerToastTimer) window.clearTimeout(playerToastTimer)
          playerToastTimer = window.setTimeout(function () {
            toast.classList.add('hidden')
          }, 1400)
        }
        announcePlayer(message)
        showPlayerControls()
      }

      function showPlayerControls() {
        playerState.controlsVisible = true
        document
          .querySelectorAll('[data-player-controls]')
          .forEach(function (ui) {
            ui.classList.remove('pointer-events-none', 'opacity-0')
          })
        schedulePlayerControls()
      }

      function schedulePlayerControls() {
        if (playerControlsTimer) window.clearTimeout(playerControlsTimer)
        if (!playerState.playing || playerState.shortcutsOpen) return
        playerControlsTimer = window.setTimeout(function () {
          const focused = document.activeElement?.closest(
            '[data-player-controls]',
          )
          if (focused) return
          playerState.controlsVisible = false
          document
            .querySelectorAll('[data-player-controls]')
            .forEach(function (ui) {
              ui.classList.add('pointer-events-none', 'opacity-0')
            })
        }, 3200)
      }

      function togglePlayerPlayback() {
        if (playerState.reviewState !== 'normal') {
          playerState.reviewState = 'normal'
          playerState.playing = true
          render()
          showPlayerToast('Playing')
          return
        }
        playerState.playing = !playerState.playing
        renderPlayerButtons()
        showPlayerToast(playerState.playing ? 'Playing' : 'Paused')
      }

      function changePlayerEpisode(offset) {
        recordWatchProgress()
        const nextEpisode = Math.min(
          10,
          Math.max(1, playerState.episodeNumber + offset),
        )
        playerState.episodeNumber = nextEpisode
        playerState.context =
          'Season ' +
          playerState.seasonNumber +
          ' · Episode ' +
          String(nextEpisode).padStart(2, '0')
        playerState.currentTime = 0
        playerState.playing = true
        playerState.episodeListOpen = false
        render()
        showPlayerToast('Playing episode ' + nextEpisode)
      }

      function renderPlayerButtons() {
        document
          .querySelectorAll('[data-player-toggle]')
          .forEach(function (button) {
            button.setAttribute(
              'aria-label',
              playerState.playing ? 'Pause' : 'Play',
            )
            button.innerHTML = playerIcon(
              playerState.playing ? 'pause' : 'play',
              button.hasAttribute('data-player-center-toggle')
                ? playerState.playing
                  ? 'size-8'
                  : 'ml-1 size-9 fill-current'
                : playerState.playing
                  ? 'size-6'
                  : 'ml-0.5 size-6 fill-current',
            )
          })
      }

      function seekPlayer(amount) {
        playerState.currentTime = Math.min(
          playerState.duration,
          Math.max(0, playerState.currentTime + amount),
        )
        updatePlayerUi()
        showPlayerToast(amount > 0 ? 'Forward 10 seconds' : 'Back 10 seconds')
      }

      function setPlayerVolume(nextVolume) {
        playerState.volume = Math.min(1, Math.max(0, nextVolume))
        if (playerState.volume > 0)
          playerState.previousVolume = playerState.volume
        updatePlayerUi()
        showPlayerToast(
          playerState.volume === 0
            ? 'Muted'
            : 'Volume ' + Math.round(playerState.volume * 100) + '%',
        )
      }

      function togglePlayerMute() {
        const muteButton = document.querySelector('[data-player-mute]')
        if (playerState.volume === 0) {
          setPlayerVolume(playerState.previousVolume || 0.72)
        } else {
          playerState.previousVolume = playerState.volume
          setPlayerVolume(0)
        }
        if (muteButton) {
          muteButton.setAttribute(
            'aria-label',
            playerState.volume === 0 ? 'Unmute' : 'Mute',
          )
          muteButton.innerHTML = playerIcon(
            playerState.volume === 0 ? 'muted' : 'volume',
            'size-6',
          )
        }
      }

      async function togglePlayerFullscreen() {
        const overlay = document.querySelector('[data-player-overlay]')
        try {
          if (document.fullscreenElement) await document.exitFullscreen()
          else if (overlay) await overlay.requestFullscreen()
          showPlayerToast(
            document.fullscreenElement ? 'Fullscreen' : 'Windowed view',
          )
        } catch {
          showPlayerToast('Fullscreen is unavailable in this preview')
        }
      }

      function toggleShortcutDialog(open) {
        playerState.shortcutsOpen = open
        render()
        document
          .querySelector(
            open ? '[data-player-shortcuts-close]' : '[data-player-shortcuts]',
          )
          ?.focus()
      }

      function setPlayerReviewState(reviewState) {
        playerState.reviewState = reviewState
        playerState.shortcutsOpen = false
        playerState.playing = false
        render()
        document.querySelector('[data-player-retry]')?.focus()
        announcePlayer(
          reviewState === 'buffering'
            ? 'Playback is buffering'
            : 'Playback stopped. Retry or exit to file details.',
        )
      }

      function retryPlayer() {
        playerState.reviewState = 'normal'
        playerState.playing = true
        render()
        document.querySelector('[data-player-overlay]')?.focus()
        showPlayerToast('Playback resumed')
      }

      function trapPlayerFocus(event) {
        if (event.key !== 'Tab') return false
        const focusRoot =
          document.querySelector('[data-player-shortcuts-dialog] section') ||
          document.querySelector('[data-player-overlay]')
        if (!focusRoot) return false
        const focusable = Array.from(
          focusRoot.querySelectorAll(
            'button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])',
          ),
        ).filter(function (element) {
          return !element.closest('[inert]')
        })
        if (!focusable.length) return false
        const first = focusable[0]
        const last = focusable[focusable.length - 1]
        if (document.activeElement === focusRoot) {
          event.preventDefault()
          ;(event.shiftKey ? last : first).focus()
          showPlayerControls()
          return true
        }
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault()
          last.focus()
          return true
        }
        if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault()
          first.focus()
          return true
        }
        return false
      }

      function bindInteractions() {
        document
          .querySelectorAll('[data-open-player]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              openPlayer(button)
            })
          })

        document
          .querySelectorAll('[data-player-close]')
          .forEach(function (button) {
            button.addEventListener('click', closePlayer)
          })

        document
          .querySelectorAll('[data-player-toggle]')
          .forEach(function (button) {
            button.addEventListener('click', togglePlayerPlayback)
          })

        document.querySelectorAll('[data-seek]').forEach(function (button) {
          button.addEventListener('click', function () {
            seekPlayer(Number(button.getAttribute('data-seek')))
          })
        })

        document
          .querySelectorAll('[data-player-mute]')
          .forEach(function (button) {
            button.addEventListener('click', togglePlayerMute)
          })

        document
          .querySelectorAll('[data-player-fullscreen]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              void togglePlayerFullscreen()
            })
          })

        document
          .querySelectorAll('[data-player-shortcuts]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              toggleShortcutDialog(true)
            })
          })

        document
          .querySelectorAll('[data-player-shortcuts-close]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              toggleShortcutDialog(false)
            })
          })

        document
          .querySelectorAll('[data-player-episodes]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              playerState.episodeListOpen = true
              render()
              document.querySelector('[data-player-episodes-close]')?.focus()
            })
          })

        document
          .querySelectorAll('[data-player-episodes-close]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              playerState.episodeListOpen = false
              render()
              document.querySelector('[data-player-episodes]')?.focus()
            })
          })

        document
          .querySelectorAll('[data-player-step]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              changePlayerEpisode(Number(button.getAttribute('data-player-step')))
            })
          })

        document
          .querySelectorAll('[data-player-episode-choice]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              const episode = Number(
                button.getAttribute('data-player-episode-choice'),
              )
              changePlayerEpisode(episode - playerState.episodeNumber)
            })
          })

        document
          .querySelectorAll('[data-player-season-select]')
          .forEach(function (select) {
            select.addEventListener('change', function () {
              playerState.seasonNumber = Number(select.value)
              playerState.episodeNumber = 1
              playerState.context =
                'Season ' + playerState.seasonNumber + ' · Episode 01'
              render()
            })
          })

        document
          .querySelectorAll('[data-player-download-season]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              button.textContent = '10 episodes queued (prototype)'
              button.disabled = true
            })
          })

        document
          .querySelectorAll('[data-mock-episode-download]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              button.textContent = 'Queued'
              button.disabled = true
            })
          })

        document
          .querySelectorAll('[data-player-review-state]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              setPlayerReviewState(
                button.getAttribute('data-player-review-state'),
              )
            })
          })

        document
          .querySelectorAll('[data-player-retry]')
          .forEach(function (button) {
            button.addEventListener('click', retryPlayer)
          })

        document
          .querySelectorAll('[data-player-error-exit]')
          .forEach(function (button) {
            button.addEventListener('click', closePlayer)
          })

        document
          .querySelectorAll('[data-player-progress]')
          .forEach(function (input) {
            input.addEventListener('input', function () {
              playerState.currentTime =
                (Number(input.value) / 1000) * playerState.duration
              updatePlayerUi()
              announcePlayer('Position ' + formatTime(playerState.currentTime))
            })
          })

        document
          .querySelectorAll('[data-player-volume]')
          .forEach(function (input) {
            input.addEventListener('input', function () {
              setPlayerVolume(Number(input.value) / 100)
            })
          })

        document
          .querySelectorAll('[data-player-stage]')
          .forEach(function (stage) {
            stage.addEventListener('mousemove', showPlayerControls)
            stage.addEventListener('pointerdown', showPlayerControls)
          })

        document
          .querySelectorAll('[data-player-overlay]')
          .forEach(function (overlay) {
            overlay.addEventListener('focusin', showPlayerControls)
          })

        document.querySelectorAll('[data-page]').forEach(function (button) {
          button.addEventListener('click', function () {
            const page = button.getAttribute('data-page')
            const query =
              page === 'search'
                ? document.querySelector('[data-search-input]')?.value ||
                  'GraphQL'
                : null
            setParams({ page: page, q: query })
          })
        })

        document
          .querySelectorAll('[data-theme-toggle]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              setParams({ theme: button.getAttribute('data-theme') })
            })
          })

        document
          .querySelectorAll('[data-feature-direction]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              const track = document.querySelector('[data-feature-track]')
              if (!track) return
              track.scrollBy({
                left:
                  Number(button.getAttribute('data-feature-direction')) *
                  track.clientWidth,
                behavior: 'smooth',
              })
              const nextPage =
                Number(button.getAttribute('data-feature-direction')) > 0
                  ? 1
                  : 0
              updateFeaturePage(nextPage)
            })
          })

        document
          .querySelectorAll('[data-feature-page]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              const track = document.querySelector('[data-feature-track]')
              const page = Number(button.getAttribute('data-feature-page'))
              if (track)
                track.scrollTo({
                  left: page * track.clientWidth,
                  behavior: 'smooth',
                })
              updateFeaturePage(page)
            })
          })

        document
          .querySelectorAll('[data-feature-pause]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              featurePaused = !featurePaused
              button.setAttribute('aria-pressed', String(featurePaused))
              button.setAttribute(
                'aria-label',
                featurePaused
                  ? 'Resume automatic featured scrolling'
                  : 'Pause automatic featured scrolling',
              )
              button.innerHTML = playerIcon(
                featurePaused ? 'play' : 'pause',
                'size-4',
              )
              const live = document.querySelector('[data-feature-live]')
              if (live)
                live.textContent = featurePaused
                  ? 'Automatic featured scrolling paused'
                  : 'Automatic featured scrolling resumed'
              scheduleFeatureAdvance()
            })
          })

        const feature = document.querySelector(
          '[aria-labelledby="prototype-featured-title"]',
        )
        if (feature) {
          feature.addEventListener('mouseenter', stopFeatureAdvance)
          feature.addEventListener('mouseleave', scheduleFeatureAdvance)
          feature.addEventListener('focusin', stopFeatureAdvance)
          feature.addEventListener('focusout', function (event) {
            if (!feature.contains(event.relatedTarget)) scheduleFeatureAdvance()
          })
        }

        document.querySelectorAll('[data-category]').forEach(function (button) {
          button.addEventListener('click', function () {
            setParams({
              page: 'library',
              category: button.getAttribute('data-category'),
            })
          })
        })

        document
          .querySelectorAll('[data-season-select]')
          .forEach(function (select) {
            select.addEventListener('change', function () {
              setParams({ season: select.value })
            })
          })

        document
          .querySelectorAll('[data-download-series]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              button.textContent = '20 episodes ready in prototype queue'
              button.disabled = true
              button.classList.add('opacity-70')
            })
          })

        document
          .querySelectorAll('[data-download-season]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              button.textContent = '10 episodes ready in prototype queue'
              button.disabled = true
              button.classList.add('opacity-70')
            })
          })

        document.querySelectorAll('[data-browse]').forEach(function (button) {
          button.addEventListener('click', function () {
            const scope = button.getAttribute('data-browse-scope') || 'global'
            const overlay = document.querySelector('[data-browse-overlay]')
            const categorySections = Array.from(
              overlay.querySelectorAll('[data-category-section]'),
            )
            categorySections.forEach(function (group) {
              group.classList.toggle(
                'hidden',
                scope !== 'global' &&
                  group.getAttribute('data-category-scope') !== scope,
              )
            })
            const visibleSections = categorySections.filter(function (group) {
              return !group.classList.contains('hidden')
            })
            categorySections.forEach(function (group) {
              const spansModal = visibleSections.length === 1
              group.classList.toggle('sm:col-span-2', spansModal)
              group.classList.toggle('lg:col-span-3', spansModal)
              const list = group.querySelector('[data-category-list]')
              list.classList.toggle('sm:grid-cols-2', spansModal)
              list.classList.toggle('lg:grid-cols-3', spansModal)
            })
            const labels = {
              global: [
                'Browse all categories',
                'Every ICC category, organized by its server group.',
              ],
              movie: [
                'Change movie category',
                'Choose another movie category without leaving Movies.',
              ],
              series: [
                'Change TV series category',
                'Choose another TV-show category without leaving Series.',
              ],
              file: [
                'Change file category',
                'Browse Games, Software, E-Books, and other files.',
              ],
            }
            overlay.querySelector('[data-browse-title]').textContent =
              labels[scope][0]
            overlay.querySelector('[data-browse-description]').textContent =
              labels[scope][1]
            overlay.classList.remove('hidden')
            document.querySelector('[data-close-browse]').focus()
          })
        })

        document
          .querySelectorAll('[data-close-browse]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              document
                .querySelector('[data-browse-overlay]')
                .classList.add('hidden')
            })
          })

        document
          .querySelectorAll('[data-search-form]')
          .forEach(function (form) {
            form.addEventListener('submit', function (event) {
              event.preventDefault()
              const input = form.querySelector('input[name="q"]')
              setParams({
                page: 'search',
                q: input && input.value ? input.value : 'GraphQL',
              })
            })
          })

        document
          .querySelectorAll('[data-search-input]')
          .forEach(function (input) {
            const suggestions = input
              .closest('form')
              .querySelector('[data-suggestions]')
            input.addEventListener('input', function () {
              suggestions.classList.toggle(
                'hidden',
                input.value.trim().length < 2,
              )
            })
            input.addEventListener('focus', function () {
              if (input.value.trim().length >= 2)
                suggestions.classList.remove('hidden')
            })
          })

        document
          .querySelectorAll('[data-load-more]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              button.textContent = '12 more items loaded'
              button.disabled = true
              button.classList.add('opacity-60')
            })
          })
      }

      function updateFeaturePage(page) {
        featurePage = page
        const dark = getState().theme === 'dark'
        document
          .querySelectorAll('[data-feature-page]')
          .forEach(function (button) {
            const active = Number(button.getAttribute('data-feature-page')) === page
            if (active) button.setAttribute('aria-current', 'true')
            else button.removeAttribute('aria-current')
            const marker = button.querySelector('span')
            if (!marker) return
            marker.className =
              'h-2 rounded-full transition-[width,background-color] ' +
              (active
                ? 'w-6 bg-amber-400'
                : dark
                  ? 'w-2 bg-white/20'
                  : 'w-2 bg-[#cbbda8]')
          })
        const live = document.querySelector('[data-feature-live]')
        if (live) live.textContent = 'Featured page ' + (page + 1) + ' of 2'
      }

      function stopFeatureAdvance() {
        if (featureTimer) window.clearTimeout(featureTimer)
        featureTimer = null
      }

      function scheduleFeatureAdvance() {
        stopFeatureAdvance()
        const track = document.querySelector('[data-feature-track]')
        if (!track || featurePaused || matchMedia('(prefers-reduced-motion: reduce)').matches)
          return
        featureTimer = window.setTimeout(function () {
          const nextPage = featurePage === 0 ? 1 : 0
          track.scrollTo({
            left: nextPage * track.clientWidth,
            behavior: 'smooth',
          })
          updateFeaturePage(nextPage)
          scheduleFeatureAdvance()
        }, 5000)
      }

      document.addEventListener('keydown', function (event) {
        const target = event.target
        if (target.matches('input, textarea, [contenteditable="true"]')) return

        if (playerState.open) {
          const key = event.key.toLowerCase()
          if (trapPlayerFocus(event)) return
          if (playerState.episodeListOpen && event.key === 'Escape') {
            event.preventDefault()
            playerState.episodeListOpen = false
            render()
            document.querySelector('[data-player-episodes]')?.focus()
            return
          }
          if (playerState.shortcutsOpen && event.key === 'Escape') {
            event.preventDefault()
            toggleShortcutDialog(false)
            return
          }
          if (event.key === 'Escape') {
            if (!document.fullscreenElement) closePlayer()
            return
          }
          if (key === ' ' || key === 'k') {
            event.preventDefault()
            togglePlayerPlayback()
          }
          if (event.key === 'ArrowLeft') {
            event.preventDefault()
            seekPlayer(-10)
          }
          if (event.key === 'ArrowRight') {
            event.preventDefault()
            seekPlayer(10)
          }
          if (event.key === 'ArrowUp') {
            event.preventDefault()
            setPlayerVolume(playerState.volume + 0.05)
          }
          if (event.key === 'ArrowDown') {
            event.preventDefault()
            setPlayerVolume(playerState.volume - 0.05)
          }
          if (key === 'm') togglePlayerMute()
          if (key === 'f') void togglePlayerFullscreen()
          if (event.key === '?') toggleShortcutDialog(true)
          return
        }

        if (event.key === 'Escape')
          document
            .querySelector('[data-browse-overlay]')
            ?.classList.add('hidden')
      })

      window.addEventListener('popstate', render)
      const initialParams = new URLSearchParams(location.search)
      if (initialParams.has('variant')) {
        initialParams.delete('variant')
        history.replaceState(
          {},
          '',
          location.pathname + '?' + initialParams.toString(),
        )
      }
      render()
    </script>
  </body>
</html>
