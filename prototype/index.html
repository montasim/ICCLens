      function getState() {
        const params = new URLSearchParams(location.search)
        return {
          variant: variants[params.get('variant')]
            ? params.get('variant')
            : 'A',
          page: pages.some(function (entry) {
            return entry[0] === params.get('page')
          })
            ? params.get('page')
            : 'home',
          category: params.get('category') || 'Latest additions',
          query: params.get('q') || 'GraphQL',
          theme: params.get('theme') === 'dark' ? 'dark' : 'light',
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;',
          }[character]
        })
      }

      function formatTime(seconds) {
        const safeSeconds = Math.max(0, Math.round(seconds))
        const hours = Math.floor(safeSeconds / 3600)
        const minutes = Math.floor((safeSeconds % 3600) / 60)
        const remainder = safeSeconds % 60
        return [hours, minutes, remainder]
          .map(function (part) {
            return String(part).padStart(2, '0')
          })
          .join(':')
      }

      function playerIcon(name, className) {
        const paths = {
          back: '<path d="M19 12H5m6 6-6-6 6-6"/>',
          play: '<path d="m8 5 11 7-11 7V5Z"/>',
          pause: '<path d="M9 5v14M15 5v14"/>',

          muted: '<path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Zm5 5 5 5m0-5-5 5"/>',
          expand: '<path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"/>',
          keyboard:
            '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M18 10h.01M7 14h7m2 0h2"/>',
          close: '<path d="m6 6 12 12M18 6 6 18"/>',
          moon: '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.8 6.8 0 0 0 21 12.8Z"/>',
          sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',
        }
        return (
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="' +
          (className || 'size-5') +
          '">' +
          paths[name] +
          '</svg>'
        )
      }

      function setParams(changes, replace) {
        const params = new URLSearchParams(location.search)
        Object.keys(changes).forEach(function (key) {
          const value = changes[key]
          if (value === null || value === undefined || value === '')
            params.delete(key)
          else params.set(key, value)
        })
        const next = location.pathname + '?' + params.toString()
        history[replace ? 'replaceState' : 'pushState']({}, '', next)
        render()
      }

      function pageLink(page, label, state, compact) {
        const active = state.page === page
        const dark =
          state.variant === 'C' ||
          (state.variant === 'A' && state.theme === 'dark')
        const base = compact
          ? 'rounded-lg px-3 py-2 text-sm font-medium transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 '
          : 'rounded-xl px-4 py-2.5 text-sm font-semibold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 '
        const tone =
          dark
            ? active
              ? 'bg-white text-zinc-950'
              : 'text-zinc-400 hover:bg-white/10 hover:text-white'
            : active
              ? 'bg-zinc-950 text-white'
              : 'text-zinc-600 hover:bg-zinc-100 hover:text-zinc-950'
        return (
          '<button type="button" data-page="' +
          page +
          '" class="' +
          base +
          tone +
          '" aria-current="' +
          (active ? 'page' : 'false') +
          '">' +
          label +
          '</button>'
        )
      }

      function pageTabs(state, compact) {
        return pages
          .map(function (entry) {
            return pageLink(entry[0], entry[1], state, compact)

          state.variant === 'C' ||
          (state.variant === 'A' && state.theme === 'dark')
        const app = document.getElementById('app')
        let content = renderVariantA(state)
        if (state.variant === 'B') content = renderVariantB(state)
        if (state.variant === 'C') content = renderVariantC(state)
        app.innerHTML =
          '<div data-page-content ' +
          (playerState.open ? 'inert aria-hidden="true" ' : '') +
          '>' +
          content +
          browsePanel(state) +
          prototypeSwitcher(state) +
          '</div>' +
          playerOverlay()
        bindInteractions()
        document.body.classList.toggle('bg-zinc-100', !dark)
        document.body.classList.toggle('text-zinc-950', !dark)
        document.body.classList.toggle('bg-zinc-950', dark)
        document.body.classList.toggle('text-zinc-100', dark)
        if (!playerState.open) window.scrollTo({ top: 0, behavior: 'instant' })
        if (playerState.open) {
          document.body.classList.add('overflow-hidden')
          startPlayerClock()
        } else {
          document.body.classList.remove('overflow-hidden')
          stopPlayerClock()
        }
      }

      function openPlayer(button) {
        playerState.open = true
        playerState.playing = true
        playerState.title = button.getAttribute('data-player-title') || 'Media'
        playerState.context =
          button.getAttribute('data-player-context') || 'Ready to play'
        playerState.image =
          button.getAttribute('data-player-image') || items[0].image
        playerState.currentTime = 1472
        playerState.duration = 6600
        playerState.controlsVisible = true
        playerState.shortcutsOpen = false
        playerState.reviewState = 'normal'
        render()
        document.querySelector('[data-player-overlay]')?.focus()
        showPlayerToast('Playing')
        schedulePlayerControls()
      }

      function closePlayer() {
        playerState.open = false
        playerState.playing = false
        playerState.shortcutsOpen = false
        playerState.reviewState = 'normal'
        if (document.fullscreenElement) void document.exitFullscreen()
        render()
        document.querySelector('[data-open-player]')?.focus()
      }

      function startPlayerClock() {
        if (playerClock) return
        playerClock = window.setInterval(function () {
          if (!playerState.open || !playerState.playing) return
          playerState.currentTime = Math.min(
            playerState.duration,
            playerState.currentTime + 1,
          )
          if (playerState.currentTime >= playerState.duration)
            playerState.playing = false
          updatePlayerUi()
        }, 1000)
      }

      function stopPlayerClock() {
        if (playerClock) window.clearInterval(playerClock)
        playerClock = null
        if (playerControlsTimer) window.clearTimeout(playerControlsTimer)
        playerControlsTimer = null
      }

      function updatePlayerUi() {
        if (!playerState.open) return
        const progress = Math.round(
          (playerState.currentTime / playerState.duration) * 1000,
        )
        const remaining = Math.max(
          0,
          playerState.duration - playerState.currentTime,
        )
        const progressInput = document.querySelector('[data-player-progress]')
        const volumeInput = document.querySelector('[data-player-volume]')
        const time = document.querySelector('[data-player-time]')
        if (progressInput) {
          progressInput.value = progress
          progressInput.setAttribute(
            'aria-valuetext',
            formatTime(playerState.currentTime) +
              ' of ' +
              formatTime(playerState.duration),
          )
        }
        if (volumeInput)
          volumeInput.value = Math.round(playerState.volume * 100)
        if (time)
          time.textContent =
            formatTime(playerState.currentTime) + ' · −' + formatTime(remaining)
      }

      function announcePlayer(message) {
        const live = document.querySelector('[data-player-live]')
        if (live) live.textContent = message
      }

      function showPlayerToast(message) {
        const toast = document.querySelector('[data-player-toast]')
        if (toast) {
          toast.textContent = message
          toast.classList.remove('hidden')
          if (playerToastTimer) window.clearTimeout(playerToastTimer)
          playerToastTimer = window.setTimeout(function () {
            toast.classList.add('hidden')
          }, 1400)
        }
        announcePlayer(message)
        showPlayerControls()
      }

      function showPlayerControls() {
        playerState.controlsVisible = true
        document
          .querySelectorAll('[data-player-controls]')
          .forEach(function (ui) {
            ui.classList.remove('pointer-events-none', 'opacity-0')
          })
        schedulePlayerControls()
      }

      function schedulePlayerControls() {
        if (playerControlsTimer) window.clearTimeout(playerControlsTimer)
        if (!playerState.playing || playerState.shortcutsOpen) return
        playerControlsTimer = window.setTimeout(function () {
          const focused = document.activeElement?.closest(
            '[data-player-controls]',
          )
          if (focused) return
          playerState.controlsVisible = false
          document
            .querySelectorAll('[data-player-controls]')
            .forEach(function (ui) {
              ui.classList.add('pointer-events-none', 'opacity-0')
            })
        }, 3200)
      }

      function togglePlayerPlayback() {
        if (playerState.reviewState !== 'normal') {
          playerState.reviewState = 'normal'
          playerState.playing = true
          render()
          showPlayerToast('Playing')
          return
        }
        playerState.playing = !playerState.playing
        renderPlayerButtons()
        showPlayerToast(playerState.playing ? 'Playing' : 'Paused')
      }

      function renderPlayerButtons() {
        document
          .querySelectorAll('[data-player-toggle]')
          .forEach(function (button) {
            button.setAttribute(
              'aria-label',
              playerState.playing ? 'Pause' : 'Play',
            )
            button.innerHTML = playerIcon(
              playerState.playing ? 'pause' : 'play',
              button.hasAttribute('data-player-center-toggle')
                ? playerState.playing
                  ? 'size-8'
                  : 'ml-1 size-9 fill-current'
                : playerState.playing
                  ? 'size-6'
                  : 'ml-0.5 size-6 fill-current',
            )
          })
      }

      function seekPlayer(amount) {
        playerState.currentTime = Math.min(
          playerState.duration,
          Math.max(0, playerState.currentTime + amount),
        )
        updatePlayerUi()
        showPlayerToast(amount > 0 ? 'Forward 10 seconds' : 'Back 10 seconds')
      }

      function setPlayerVolume(nextVolume) {
        playerState.volume = Math.min(1, Math.max(0, nextVolume))
        if (playerState.volume > 0)
          playerState.previousVolume = playerState.volume
        updatePlayerUi()
        showPlayerToast(
          playerState.volume === 0
            ? 'Muted'
            : 'Volume ' + Math.round(playerState.volume * 100) + '%',
        )
      }

      function togglePlayerMute() {
        const muteButton = document.querySelector('[data-player-mute]')
        if (playerState.volume === 0) {
          setPlayerVolume(playerState.previousVolume || 0.72)
        } else {
          playerState.previousVolume = playerState.volume
          setPlayerVolume(0)
        }
        if (muteButton) {
          muteButton.setAttribute(
            'aria-label',
            playerState.volume === 0 ? 'Unmute' : 'Mute',
          )
          muteButton.innerHTML = playerIcon(
            playerState.volume === 0 ? 'muted' : 'volume',
            'size-6',
          )
        }
      }

      async function togglePlayerFullscreen() {
        const overlay = document.querySelector('[data-player-overlay]')
        try {
          if (document.fullscreenElement) await document.exitFullscreen()
          else if (overlay) await overlay.requestFullscreen()
          showPlayerToast(
            document.fullscreenElement ? 'Fullscreen' : 'Windowed view',
          )
        } catch {
          showPlayerToast('Fullscreen is unavailable in this preview')
        }
      }

      function toggleShortcutDialog(open) {
        playerState.shortcutsOpen = open
        render()
        document
          .querySelector(
            open ? '[data-player-shortcuts-close]' : '[data-player-shortcuts]',
          )
          ?.focus()
      }

      function setPlayerReviewState(reviewState) {
        playerState.reviewState = reviewState
        playerState.shortcutsOpen = false
        playerState.playing = false
        render()
        document.querySelector('[data-player-retry]')?.focus()
        announcePlayer(
          reviewState === 'buffering'
            ? 'Playback is buffering'
            : 'Playback stopped. Retry or exit to file details.',
        )
      }

      function retryPlayer() {
        playerState.reviewState = 'normal'
        playerState.playing = true
        render()
        document.querySelector('[data-player-overlay]')?.focus()
        showPlayerToast('Playback resumed')
      }

      function trapPlayerFocus(event) {
        if (event.key !== 'Tab') return false
        const focusRoot =
          document.querySelector('[data-player-shortcuts-dialog] section') ||
          document.querySelector('[data-player-overlay]')
        if (!focusRoot) return false
        const focusable = Array.from(
          focusRoot.querySelectorAll(
            'button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])',
          ),
        ).filter(function (element) {
          return !element.closest('[inert]')
        })
        if (!focusable.length) return false
        const first = focusable[0]
        const last = focusable[focusable.length - 1]
        if (document.activeElement === focusRoot) {
          event.preventDefault()
          ;(event.shiftKey ? last : first).focus()
          showPlayerControls()
          return true
        }
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault()
          last.focus()
          return true
        }
        if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault()
          first.focus()
          return true
        }
        return false
      }

      function bindInteractions() {
        document
          .querySelectorAll('[data-open-player]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              openPlayer(button)
            })
          })

        document
          .querySelectorAll('[data-player-close]')
          .forEach(function (button) {
            button.addEventListener('click', closePlayer)
          })

        document
          .querySelectorAll('[data-player-toggle]')
          .forEach(function (button) {
            button.addEventListener('click', togglePlayerPlayback)
          })

        document.querySelectorAll('[data-seek]').forEach(function (button) {
          button.addEventListener('click', function () {
            seekPlayer(Number(button.getAttribute('data-seek')))
          })
        })

        document
          .querySelectorAll('[data-player-mute]')
          .forEach(function (button) {
            button.addEventListener('click', togglePlayerMute)
          })

        document
          .querySelectorAll('[data-player-fullscreen]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              void togglePlayerFullscreen()
            })
          })

        document
          .querySelectorAll('[data-player-shortcuts]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              toggleShortcutDialog(true)
            })
          })

        document
          .querySelectorAll('[data-player-shortcuts-close]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              toggleShortcutDialog(false)
            })
          })

        document
          .querySelectorAll('[data-player-review-state]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              setPlayerReviewState(
                button.getAttribute('data-player-review-state'),
              )
            })
          })

        document
          .querySelectorAll('[data-player-retry]')
          .forEach(function (button) {
            button.addEventListener('click', retryPlayer)
          })

        document
          .querySelectorAll('[data-player-error-exit]')
          .forEach(function (button) {
            button.addEventListener('click', closePlayer)
          })

        document
          .querySelectorAll('[data-player-progress]')
          .forEach(function (input) {
            input.addEventListener('input', function () {
              playerState.currentTime =
                (Number(input.value) / 1000) * playerState.duration
              updatePlayerUi()
              announcePlayer('Position ' + formatTime(playerState.currentTime))
            })
          })

        document
          .querySelectorAll('[data-player-volume]')
          .forEach(function (input) {
            input.addEventListener('input', function () {
              setPlayerVolume(Number(input.value) / 100)
            })
          })

        document
          .querySelectorAll('[data-player-stage]')
          .forEach(function (stage) {
            stage.addEventListener('mousemove', showPlayerControls)
            stage.addEventListener('pointerdown', showPlayerControls)
          })

        document
          .querySelectorAll('[data-player-overlay]')
          .forEach(function (overlay) {
            overlay.addEventListener('focusin', showPlayerControls)
          })

        document.querySelectorAll('[data-page]').forEach(function (button) {
          button.addEventListener('click', function () {
            const page = button.getAttribute('data-page')
            const query =
              page === 'search'
                ? document.querySelector('[data-search-input]')?.value ||
                  'GraphQL'
                : null
            setParams({ page: page, q: query })
          })
        })

        document
          .querySelectorAll('[data-theme-toggle]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              setParams({ theme: button.getAttribute('data-theme') })
            })
          })

        document.querySelectorAll('[data-variant]').forEach(function (button) {
          button.addEventListener('click', function () {
            setParams({ variant: button.getAttribute('data-variant') })
          })
        })

        document.querySelectorAll('[data-category]').forEach(function (button) {
          button.addEventListener('click', function () {
            setParams({
              page: 'library',
              category: button.getAttribute('data-category'),
            })
          })
        })

        document.querySelectorAll('[data-browse]').forEach(function (button) {
          button.addEventListener('click', function () {
            document
              .querySelector('[data-browse-overlay]')
              .classList.remove('hidden')
            document.querySelector('[data-close-browse]').focus()
          })
        })

        document
          .querySelectorAll('[data-close-browse]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              document
                .querySelector('[data-browse-overlay]')
                .classList.add('hidden')
            })
          })

        document
          .querySelectorAll('[data-search-form]')
          .forEach(function (form) {
            form.addEventListener('submit', function (event) {
              event.preventDefault()
              const input = form.querySelector('input[name="q"]')
              setParams({
                page: 'search',
                q: input && input.value ? input.value : 'GraphQL',
              })
            })
          })

        document
          .querySelectorAll('[data-search-input]')
          .forEach(function (input) {
            const suggestions = input
              .closest('form')
              .querySelector('[data-suggestions]')
            input.addEventListener('input', function () {
              suggestions.classList.toggle(
                'hidden',
                input.value.trim().length < 2,
              )
            })
            input.addEventListener('focus', function () {
              if (input.value.trim().length >= 2)
                suggestions.classList.remove('hidden')
            })
          })

        document
          .querySelectorAll('[data-load-more]')
          .forEach(function (button) {
            button.addEventListener('click', function () {
              button.textContent = '12 more items loaded'
              button.disabled = true
              button.classList.add('opacity-60')
            })
          })
      }

      document.addEventListener('keydown', function (event) {
        const target = event.target
        if (target.matches('input, textarea, [contenteditable="true"]')) return

        if (playerState.open) {
          const key = event.key.toLowerCase()
          if (trapPlayerFocus(event)) return
          if (playerState.shortcutsOpen && event.key === 'Escape') {
            event.preventDefault()
            toggleShortcutDialog(false)
            return
          }
          if (event.key === 'Escape') {
            if (!document.fullscreenElement) closePlayer()
            return
          }
          if (key === ' ' || key === 'k') {
            event.preventDefault()
            togglePlayerPlayback()
          }
          if (event.key === 'ArrowLeft') {
            event.preventDefault()
            seekPlayer(-10)
          }
          if (event.key === 'ArrowRight') {
            event.preventDefault()
            seekPlayer(10)
          }
          if (event.key === 'ArrowUp') {
            event.preventDefault()
            setPlayerVolume(playerState.volume + 0.05)
          }
          if (event.key === 'ArrowDown') {
            event.preventDefault()
            setPlayerVolume(playerState.volume - 0.05)
          }
          if (key === 'm') togglePlayerMute()
          if (key === 'f') void togglePlayerFullscreen()
          if (event.key === '?') toggleShortcutDialog(true)
          return
        }

        const keys = Object.keys(variants)
        const state = getState()
        const index = keys.indexOf(state.variant)
        if (event.key === 'ArrowLeft')
          setParams({ variant: keys[(index - 1 + keys.length) % keys.length] })
        if (event.key === 'ArrowRight')
          setParams({ variant: keys[(index + 1) % keys.length] })
        if (event.key === 'Escape')
          document
            .querySelector('[data-browse-overlay]')
            ?.classList.add('hidden')
      })

      window.addEventListener('popstate', render)
      render()
    </script>
  </body>
</html>
