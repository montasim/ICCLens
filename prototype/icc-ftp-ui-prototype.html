    const variants = {
      A: { name: 'Catalog', description: 'Balanced poster grid and strong filters' },
      B: { name: 'Navigator', description: 'Dense sidebar and list-first browsing' },
      C: { name: 'Spotlight', description: 'Media-first shelves and cinematic details' }

    const pages = [
      ['home', 'Home'],
      ['library', 'Library'],
      ['search', 'Search'],
      ['detail', 'Movie'],
      ['series', 'Series'],
      ['download', 'File'],
      ['states', 'States']
    ];

    function getState() {
      const params = new URLSearchParams(location.search);
      return {
        variant: variants[params.get('variant')] ? params.get('variant') : 'A',
        page: pages.some(function(entry) { return entry[0] === params.get('page'); }) ? params.get('page') : 'home',
        category: params.get('category') || 'Latest additions',
        query: params.get('q') || 'GraphQL'
      };
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(character) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[character];
      });
    }

    function setParams(changes, replace) {
      const params = new URLSearchParams(location.search);
      Object.keys(changes).forEach(function(key) {
        const value = changes[key];
        if (value === null || value === undefined || value === '') params.delete(key);
        else params.set(key, value);
      });
      const next = location.pathname + '?' + params.toString();
      history[replace ? 'replaceState' : 'pushState']({}, '', next);
      render();
    }

    function pageLink(page, label, state, compact) {
      const active = state.page === page;
      const base = compact
        ? 'rounded-lg px-3 py-2 text-sm font-medium transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 '
        : 'rounded-xl px-4 py-2.5 text-sm font-semibold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 ';
      const tone = state.variant === 'C'
        ? (active ? 'bg-white text-zinc-950' : 'text-zinc-400 hover:bg-white/10 hover:text-white')
        : (active ? 'bg-zinc-950 text-white' : 'text-zinc-600 hover:bg-zinc-100 hover:text-zinc-950');
      return '<button type="button" data-page="' + page + '" class="' + base + tone + '" aria-current="' + (active ? 'page' : 'false') + '">' + label + '</button>';
    }

    function pageTabs(state, compact) {
      return pages.map(function(entry) {
        return pageLink(entry[0], entry[1], state, compact);
      }).join('');
    }

    function brand(dark) {
      return [
        '<button type="button" data-page="home" class="flex shrink-0 items-center gap-3 rounded-xl text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-500">',

      ].join('');
    }

    function prototypeSwitcher(state) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(state.variant);
      const previous = keys[(index - 1 + keys.length) % keys.length];
      const next = keys[(index + 1) % keys.length];

        '<div class="fixed bottom-4 left-1/2 z-[70] flex -translate-x-1/2 items-center gap-1 rounded-2xl border border-white/10 bg-zinc-950 p-1.5 text-white shadow-2xl shadow-zinc-950/30">',

          '<div class="min-w-44 px-4 text-center">',
            '<p class="text-[11px] font-bold uppercase tracking-[0.16em] text-violet-300">Prototype ' + state.variant + '</p>',
            '<p class="text-sm font-bold">' + variants[state.variant].name + '</p>',

    function renderVariantA(state) {
      let content = homeA(state);
      if (state.page === 'library') content = libraryA(state);

      if (state.page === 'detail') content = detailA();
      if (state.page === 'series') content = seriesA();
      if (state.page === 'download') content = downloadA();
      if (state.page === 'states') content = statesA();
      return shellA(state, content);

    function renderVariantB(state) {
      let content = homeB(state);
      if (state.page === 'library') content = libraryB(state);
      if (state.page === 'search') content = searchB(state);
      if (state.page === 'detail') content = detailB(false);
      if (state.page === 'series') content = detailB(true);
      if (state.page === 'download') content = downloadB();
      if (state.page === 'states') content = statesA();
      return shellB(state, content);

    function renderVariantC(state) {
      let content = homeC(state);
      if (state.page === 'library') content = libraryC(state);
      if (state.page === 'search') content = searchC(state);
      if (state.page === 'detail') content = detailC(false);
      if (state.page === 'series') content = detailC(true);
      if (state.page === 'download') content = downloadC();
      if (state.page === 'states') content = statesC();
      return shellC(state, content);
    }

    function render() {
      const state = getState();
      const app = document.getElementById('app');
      let content = renderVariantA(state);
      if (state.variant === 'B') content = renderVariantB(state);
      if (state.variant === 'C') content = renderVariantC(state);
      app.innerHTML = content + browsePanel(state) + prototypeSwitcher(state);
      bindInteractions();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function bindInteractions() {
      document.querySelectorAll('[data-page]').forEach(function(button) {
        button.addEventListener('click', function() {
          const page = button.getAttribute('data-page');
          const query = page === 'search' ? (document.querySelector('[data-search-input]')?.value || 'GraphQL') : null;
          setParams({ page: page, q: query });
        });
      });

      document.querySelectorAll('[data-variant]').forEach(function(button) {
        button.addEventListener('click', function() {
          setParams({ variant: button.getAttribute('data-variant') });
        });
      });

      document.querySelectorAll('[data-category]').forEach(function(button) {
        button.addEventListener('click', function() {
          setParams({ page: 'library', category: button.getAttribute('data-category') });
        });
      });

      document.querySelectorAll('[data-browse]').forEach(function(button) {
        button.addEventListener('click', function() {
          document.querySelector('[data-browse-overlay]').classList.remove('hidden');
          document.querySelector('[data-close-browse]').focus();
        });
      });

      document.querySelectorAll('[data-close-browse]').forEach(function(button) {
        button.addEventListener('click', function() {
          document.querySelector('[data-browse-overlay]').classList.add('hidden');
        });
      });

      document.querySelectorAll('[data-search-form]').forEach(function(form) {
        form.addEventListener('submit', function(event) {
          event.preventDefault();
          const input = form.querySelector('input[name="q"]');
          setParams({ page: 'search', q: input && input.value ? input.value : 'GraphQL' });
        });
      });

      document.querySelectorAll('[data-search-input]').forEach(function(input) {
        const suggestions = input.closest('form').querySelector('[data-suggestions]');
        input.addEventListener('input', function() {
          suggestions.classList.toggle('hidden', input.value.trim().length < 2);
        });
        input.addEventListener('focus', function() {
          if (input.value.trim().length >= 2) suggestions.classList.remove('hidden');
        });
      });

      document.querySelectorAll('[data-load-more]').forEach(function(button) {
        button.addEventListener('click', function() {
          button.textContent = '12 more items loaded';
          button.disabled = true;
          button.classList.add('opacity-60');
        });
      });
    }

    document.addEventListener('keydown', function(event) {
      const target = event.target;
      if (target.matches('input, textarea, [contenteditable="true"]')) return;
      const keys = Object.keys(variants);
      const state = getState();
      const index = keys.indexOf(state.variant);
      if (event.key === 'ArrowLeft') setParams({ variant: keys[(index - 1 + keys.length) % keys.length] });
      if (event.key === 'ArrowRight') setParams({ variant: keys[(index + 1) % keys.length] });
      if (event.key === 'Escape') document.querySelector('[data-browse-overlay]')?.classList.add('hidden');
    });

    window.addEventListener('popstate', render);
    render();
  </script>
